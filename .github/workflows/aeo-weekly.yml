name: AEO Weekly Monitor

on:
  schedule:
    - cron: "30 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aeo-weekly-publication
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Prepare AEO history
        run: |
          export MONITORING_STATE_DIR="$RUNNER_TEMP/gravel-aeo-state"
          bash scripts/daily-monitoring-state.sh prepare aeo
          printf 'MONITORING_STATE_DIR=%s\n' "$MONITORING_STATE_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pip install --quiet google-analytics-data

      - name: Write SSH keys
        env:
          GG_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          RL_SSH_PRIVATE_KEY: ${{ secrets.RL_SSH_PRIVATE_KEY }}
          XC_SSH_PRIVATE_KEY: ${{ secrets.XC_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/aeo-keys"
          printf '%s\n' "$GG_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/aeo-keys/gravelgod"
          printf '%s\n' "$RL_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/aeo-keys/roadie"
          printf '%s\n' "$XC_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/aeo-keys/xcski"
          chmod 600 "$RUNNER_TEMP/aeo-keys/gravelgod" \
            "$RUNNER_TEMP/aeo-keys/roadie" \
            "$RUNNER_TEMP/aeo-keys/xcski"

      - name: Collect weekly AEO facts
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
          GG_GA4_PROPERTY_ID: ${{ secrets.GG_GA4_PROPERTY_ID }}
          RL_GA4_PROPERTY_ID: ${{ secrets.RL_GA4_PROPERTY_ID }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY_PATH: ${{ runner.temp }}/aeo-keys/gravelgod
          RL_SSH_HOST: ${{ secrets.RL_SSH_HOST }}
          RL_SSH_USER: ${{ secrets.RL_SSH_USER }}
          RL_SSH_PORT: ${{ secrets.RL_SSH_PORT }}
          RL_SSH_KEY_PATH: ${{ runner.temp }}/aeo-keys/roadie
          XC_SSH_HOST: ${{ secrets.XC_SSH_HOST }}
          XC_SSH_USER: ${{ secrets.XC_SSH_USER }}
          XC_SSH_PORT: ${{ secrets.XC_SSH_PORT }}
          XC_SSH_KEY_PATH: ${{ runner.temp }}/aeo-keys/xcski
        run: |
          bash scripts/with-google-credentials.sh python3 scripts/aeo_weekly.py \
            --output-dir "$MONITORING_STATE_DIR/data/aeo"

      - name: Remove SSH keys
        if: always()
        run: rm -f -- "$RUNNER_TEMP/aeo-keys/"{gravelgod,roadie,xcski}

      - name: Publish AEO history
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: bash scripts/daily-monitoring-state.sh publish aeo

      - name: Check collector health
        run: |
          python3 scripts/aeo_weekly.py --output-dir "$MONITORING_STATE_DIR/data/aeo" \
            --validate-latest --require-all-ok
