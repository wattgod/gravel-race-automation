name: Aggressive Process (2 Days)

on:
  # PAUSED: Schedule disabled until API keys/credits are fixed
  # schedule:
  #   # Run every 3 minutes (20 races/hour = 480/day = ~0.8 days for all)
  #   # This is aggressive - may hit rate limits, but will retry
  #   - cron: '*/3 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Races per run'
        required: false
        default: '1'
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Get next race
        id: set-matrix
        env:
          PROCESS_LIMIT: ${{ github.event.inputs.limit || '1' }}
        run: |
          python3 << 'EOF'
          import json
          import os
          
          with open("db/gravel_races_full_database.json") as f:
              db = json.load(f)
          
          limit = int(os.environ["PROCESS_LIMIT"] or 1)
          
          # Get all unprocessed races
          races = db.get("races", [])
          
          processed = set()
          if os.path.exists("data/processed/completed.txt"):
              with open("data/processed/completed.txt") as f:
                  processed = set(f.read().splitlines())
          
          races = [r for r in races if r.get("RACE_NAME", "") not in processed]
          races = races[:limit]
          
          if not races:
              matrix = {"include": []}
          else:
              matrix = {
                  "include": [
                      {
                          "race_name": r.get("RACE_NAME", ""),
                          "folder": r.get("RACE_NAME", "").lower().replace(" ", "-").replace("'", "").replace(",", "").replace(".", "")
                      }
                      for r in races
                  ]
              }
          
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={json.dumps(matrix)}\n")
          EOF

  process:
    needs: prepare
    if: ${{ fromJson(needs.prepare.outputs.matrix).include != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    
    env:
      RACE_NAME: ${{ matrix.race_name }}
      RACE_FOLDER: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: pip install anthropic requests pyyaml python-frontmatter
      
      - name: Process ${{ matrix.race_name }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        timeout-minutes: 10
        run: |
          python scripts/research.py \
            --race "${RACE_NAME}" \
            --folder "${RACE_FOLDER}"
          
          python scripts/synthesize.py \
            --input "research-dumps/${RACE_FOLDER}-raw.md" \
            --output "briefs/${RACE_FOLDER}-brief.md"
          
          python scripts/generate_json.py \
            --input "briefs/${RACE_FOLDER}-brief.md" \
            --output "landing-pages/${RACE_FOLDER}.json"
          
          mkdir -p data/processed
          printf '%s\n' "$RACE_NAME" >> data/processed/completed.txt
      
      - name: Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add research-dumps/ briefs/ landing-pages/ data/processed/
          git commit -m "Processed: ${RACE_NAME}" || true
          git push || true

