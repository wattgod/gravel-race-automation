name: Auto-Process Races (Scheduled)

on:
  schedule:
    # Run weekly on Wednesdays at 2 AM UTC (budget cap: 5 races/run)
    - cron: '0 2 * * 3'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Which tier to process (1, 2, 3, 4, or all)'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - 'all'
      limit:
        description: 'Max races to process per run (budget cap)'
        required: false
        default: '5'
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_work: ${{ steps.set-matrix.outputs.has_work }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Build race matrix
        id: set-matrix
        env:
          PROCESS_TIER: ${{ github.event.inputs.tier || '2' }}
          PROCESS_LIMIT: ${{ github.event.inputs.limit || '5' }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import sys
          sys.path.insert(0, 'scripts')
          from auto_process_review import output_paths

          with open("db/gravel_races_full_database.json") as f:
              db = json.load(f)

          # Get tier from input or default to 2
          tier = os.environ["PROCESS_TIER"]
          limit = int(os.environ["PROCESS_LIMIT"] or 0)

          # Filter by tier
          if tier != "all":
              races = [r for r in db.get("races", []) if str(r.get("TIER", "")) == tier]
          else:
              races = db.get("races", [])

          # Filter out already processed
          processed = set()
          processed_file = "data/processed/completed.txt"
          if os.path.exists(processed_file):
              with open(processed_file) as f:
                  processed = set(f.read().splitlines())

          races = [r for r in races if r.get("RACE_NAME", "") not in processed]

          # Apply limit
          if limit > 0:
              races = races[:limit]

          if not races:
              print("No races to process")
              matrix = {"include": []}
          else:
              # Build matrix
              matrix = {
                  "include": [
                      {
                          "race_name": r.get("RACE_NAME", ""),
                          "folder": r.get("RACE_NAME", "").lower().replace(" ", "-").replace("'", "").replace(",", "").replace(".", "")
                      }
                      for r in races
                  ]
              }

          folders = set()
          for race in matrix["include"]:
              output_paths(race["folder"])
              if race["folder"] in folders or len(race["race_name"].splitlines()) != 1:
                  raise SystemExit("Invalid race row in planned research batch")
              folders.add(race["folder"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"has_work={str(bool(matrix['include'])).lower()}\n")
              out.write(f"matrix={json.dumps(matrix)}\n")
          print(f"Processing {len(matrix.get('include', []))} races")
          EOF

  process:
    needs: prepare
    if: needs.prepare.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      max-parallel: 1  # Process one at a time to avoid rate limits
      fail-fast: false

    env:
      RACE_NAME: ${{ matrix.race_name }}
      RACE_FOLDER: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - run: pip install anthropic requests pyyaml python-frontmatter

      - name: Process ${{ matrix.race_name }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "Processing: ${RACE_NAME}"
          rm -f -- "research-dumps/${RACE_FOLDER}-raw.md" "briefs/${RACE_FOLDER}-brief.md" "landing-pages/${RACE_FOLDER}.json"

          python scripts/research.py \
            --race "${RACE_NAME}" \
            --folder "${RACE_FOLDER}"

          python scripts/validate.py \
            --input "research-dumps/${RACE_FOLDER}-raw.md" || echo "Validation skipped"

          python scripts/synthesize.py \
            --input "research-dumps/${RACE_FOLDER}-raw.md" \
            --output "briefs/${RACE_FOLDER}-brief.md"

          python scripts/generate_json.py \
            --input "briefs/${RACE_FOLDER}-brief.md" \
            --output "landing-pages/${RACE_FOLDER}.json"

          # Quality gates
          python scripts/quality_gates.py \
            --file "research-dumps/${RACE_FOLDER}-raw.md" \
            --type research || echo "Quality gate warnings"

          python scripts/quality_gates.py \
            --file "briefs/${RACE_FOLDER}-brief.md" \
            --type brief || echo "Quality gate warnings"

      - name: Validate and scan race output
        run: |
          destination="$RUNNER_TEMP/race-output"
          python scripts/auto_process_review.py stage "$RACE_FOLDER" "$destination"
          archive="$RUNNER_TEMP/trufflehog.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 75 --proto '=https' \
            --output "$archive" \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.100.1/trufflehog_3.100.1_linux_amd64.tar.gz
          echo "b2460688116f29ce33f1afe16d14fef3fa3db928e74ba55a6c9fed392c60ad69  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" trufflehog
          if ! "$RUNNER_TEMP/trufflehog" filesystem "$destination" --no-verification --no-update --fail --fail-on-scan-errors --concurrency=2 >/dev/null 2>&1; then
            echo "::error::Race output failed its offline secret scan."
            exit 1
          fi

      - name: Save race output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: race-output-${{ matrix.folder }}
          path: ${{ runner.temp }}/race-output/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    needs: [prepare, process]
    if: "!cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.has_work == 'true'"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Download successful race output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: race-output-*
          path: ${{ runner.temp }}/race-artifacts
      - name: Assemble successful race outputs
        env:
          RACE_MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: python scripts/auto_process_review.py restore "$RUNNER_TEMP/race-artifacts" "$RACE_MATRIX"
      - name: Publish research for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- research-dumps/ briefs/ landing-pages/ data/processed/completed.txt
          if git diff --cached --quiet; then
            echo "There are no new research changes."
            exit 0
          fi
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          branch="review/auto-process/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git commit -m "Review scheduled race research ($(date -u +%F))"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$branch"
          printf '[Review scheduled race results](%s/%s/compare/main...%s?expand=1)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$branch" >> "$GITHUB_STEP_SUMMARY"
