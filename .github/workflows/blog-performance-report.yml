name: Blog Performance Report

# Per-post GA4 performance for essays (/articles/), WordPress posts and /blog/
# previews/recaps/roundups: last 7 complete days vs the previous 7, per usable
# day. Posts had no GA4 before 2026-10-09, so they are never compared against
# earlier days; QA dates (2026-10-09/10) are excluded by default. JSON +
# markdown are uploaded as a workflow artifact. Runs from main also stage
# the data/blog-performance/ snapshots on a review branch.
# Read-only GA4 scope.

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC = 07:00 MT
  workflow_dispatch:
    inputs:
      end_date:
        description: "Last day of this week's window (YYYY-MM-DD, default yesterday)"
        required: false
        default: ""
      exclude_dates:
        description: "Comma-separated YYYY-MM-DD to drop (blank = 2026-10-09,2026-10-10; 'none' = drop nothing)"
        required: false
        default: ""
      compare_redesign:
        description: "Add before/after-redesign section (types tracked before 2026-10-09 only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: blog-performance-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      stem: ${{ steps.build.outputs.stem }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install GA4 client dependencies
        run: pip install --quiet google-auth requests
      - name: Build report
        id: build
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
          GG_GA4_PROPERTY_ID: ${{ secrets.GG_GA4_PROPERTY_ID }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          END_DATE: ${{ inputs.end_date }}
          EXCLUDE_DATES: ${{ inputs.exclude_dates }}
          COMPARE_REDESIGN: ${{ inputs.compare_redesign }}
        run: |
          PROPERTY="${GG_GA4_PROPERTY_ID:-$GA4_PROPERTY_ID}"
          if [ -z "$PROPERTY" ]; then
            echo "::error::GG_GA4_PROPERTY_ID (or GA4_PROPERTY_ID) is not configured"
            exit 1
          fi
          STEM="$(date -u +%Y-%m-%d)"
          echo "stem=$STEM" >> "$GITHUB_OUTPUT"
          ARGS=(--stem "$STEM" --known-pages-only)
          if [ -n "$END_DATE" ]; then ARGS+=(--end-date "$END_DATE"); fi
          if [ -n "$EXCLUDE_DATES" ]; then ARGS+=(--exclude-dates "$EXCLUDE_DATES"); fi
          if [ "$COMPARE_REDESIGN" = "true" ]; then ARGS+=(--compare-redesign); fi
          bash scripts/with-google-credentials.sh --require-service-account python3 scripts/blog_performance_report.py \
            --property "$PROPERTY" \
            --output-dir data/blog-performance \
            "${ARGS[@]}"
          cat "data/blog-performance/${STEM}.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blog-performance-${{ github.run_id }}
          path: |
            data/blog-performance/${{ steps.build.outputs.stem }}.json
            data/blog-performance/${{ steps.build.outputs.stem }}.md
          if-no-files-found: error
          retention-days: 90
  stage-review:
    needs: report
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: blog-performance-${{ github.run_id }}
          path: ${{ runner.temp }}/blog-performance
      - name: Publish review branch
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
          STEM: ${{ needs.report.outputs.stem }}
        run: |
          set -euo pipefail
          if [[ ! "$STEM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || ! git diff --cached --quiet; then
            echo "::error::Invalid report date or unexpected staged changes"
            exit 1
          fi
          for extension in json md; do
            source="$RUNNER_TEMP/blog-performance/$STEM.$extension"
            if [[ ! -f "$source" || -L "$source" ]]; then
              echo "::error::Missing regular report file ($extension)"
              exit 1
            fi
            cp -- "$source" "data/blog-performance/$STEM.$extension"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "data/blog-performance/${STEM}.json" "data/blog-performance/${STEM}.md"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: blog performance snapshot $STEM"
          branch="review/blog-performance/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push origin "HEAD:refs/heads/$branch"
          printf '\n[Review blog performance snapshot](%s/%s/compare/main...%s?expand=1)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$branch" >> "$GITHUB_STEP_SUMMARY"
