name: Community Re-Research

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of races to research'
        required: false
        default: '20'
        type: string
      tier:
        description: 'Filter by tier'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - '1'
          - '2'
          - '3'
          - '4'
      force:
        description: 'Force re-research even if data exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RESEARCH_COUNT: ${{ inputs.count }}
      RESEARCH_TIER: ${{ inputs.tier }}
      FORCE_RESEARCH: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests anthropic pyyaml python-dotenv

      - name: Run community research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        shell: bash
        run: |
          args=(--auto "$RESEARCH_COUNT" --concurrency 2)
          if [[ "$RESEARCH_TIER" != all ]]; then
            args+=(--tier "$RESEARCH_TIER")
          fi
          if [[ "$FORCE_RESEARCH" == true ]]; then
            args+=(--force)
          fi
          python scripts/batch_community_research.py "${args[@]}"

      - name: Publish changes for review
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git diff --cached --exit-code --quiet
          git ls-files -z --cached --others --exclude-standard -- ':(glob)research-dumps/*-community.md' ':(glob)research-dumps/*-community.bak.md' |
            git --literal-pathspecs add -A --pathspec-from-file=- --pathspec-file-nul
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          branch="review/community-research/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: community re-research (tier=${RESEARCH_TIER}, count=${RESEARCH_COUNT})"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push origin "HEAD:refs/heads/$branch"
          review_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          printf 'Review the proposed updates in a [pull request](%s).\n' "$review_url" >> "$GITHUB_STEP_SUMMARY"
