name: Community Re-Research

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of races to research'
        required: false
        default: '20'
        type: string
      tier:
        description: 'Filter by tier'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - '1'
          - '2'
          - '3'
          - '4'
      force:
        description: 'Force re-research even if data exists'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      RESEARCH_COUNT: ${{ inputs.count }}
      RESEARCH_TIER: ${{ inputs.tier }}
      FORCE_RESEARCH: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests anthropic pyyaml python-dotenv

      - name: Run community research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        shell: bash
        run: |
          args=(--auto "$RESEARCH_COUNT" --concurrency 2)
          if [[ "$RESEARCH_TIER" != all ]]; then
            args+=(--tier "$RESEARCH_TIER")
          fi
          if [[ "$FORCE_RESEARCH" == true ]]; then
            args+=(--force)
          fi
          python scripts/batch_community_research.py "${args[@]}"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: community re-research (tier=${RESEARCH_TIER}, count=${RESEARCH_COUNT})"
          git push
