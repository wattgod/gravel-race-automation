name: Mission Control alias authentication diagnostic (temporary)

on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [baseline, recovery]
        required: true
      expected_source_sha:
        description: Exact temporary branch commit SHA, including this reviewed diagnostic
        type: string
        required: true

permissions:
  contents: read

jobs:
  auth-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        secret_name: [SUPABASE_SERVICE_KEY, SUPABASE_SERVICE_ROLE_KEY]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install same SDK and dotenv dependencies as actual collector
        run: pip install --quiet supabase python-dotenv
      - name: Zero-row authentication diagnostic
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets[matrix.secret_name] }}
          CONSUMER_SECRET_NAME: ${{ matrix.secret_name }}
          AUTH_DIAGNOSTIC_PHASE: ${{ inputs.phase }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: python3 scripts/qa/gg-mission-control-auth-diagnostic.py
      - name: Preserve safe metadata on either result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gg-mission-control-auth-${{ matrix.secret_name }}-${{ inputs.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: gg-mission-control-auth-safe.json
          if-no-files-found: error
          retention-days: 7
