name: Morning Intel

# Daily interpreted report (GA4 + checkout + Mission Control + errors) for
# both brands → gravelgodcoaching@gmail.com, with snapshots committed to
# data/intel-snapshots/ so trends compound. Spec: docs/specs/daily-intel-report.md

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 06:00 MT
  workflow_dispatch:

concurrency:
  group: morning-intel-publication
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  intel:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet google-analytics-data supabase python-dotenv
      - name: Run Morning Intel
        id: snapshot
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
          GG_GA4_PROPERTY_ID: ${{ secrets.GG_GA4_PROPERTY_ID }}
          RL_GA4_PROPERTY_ID: ${{ secrets.RL_GA4_PROPERTY_ID }}
          XC_GA4_PROPERTY_ID: ${{ secrets.XC_GA4_PROPERTY_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GH_TOKEN: ${{ github.token }}
        # One surface: the Morning Console (12:45 UTC) reads this snapshot and
        # emails the single daily digest. This job no longer emails.
        run: bash scripts/with-google-credentials.sh python3 scripts/daily_intel.py --no-email --github-output "$GITHUB_OUTPUT"
      - name: Commit snapshot
        shell: bash
        env:
          SNAPSHOT_DATE: ${{ steps.snapshot.outputs.snapshot_date }}
        run: |
          set -euo pipefail
          if [[ ! "$SNAPSHOT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Missing or invalid completed snapshot date." >&2
            exit 1
          fi
          if ! git diff --cached --quiet; then
            echo "Unexpected staged changes before snapshot publication." >&2
            exit 1
          fi
          snapshot="data/intel-snapshots/$SNAPSHOT_DATE"
          if ! git diff --quiet -- . ":(exclude)$snapshot.json" ":(exclude)$snapshot.md"; then
            echo "Unexpected tracked changes outside the snapshot pair." >&2
            exit 1
          fi
          for path in "$snapshot.json" "$snapshot.md"; do
            if [[ ! -f "$path" || -L "$path" ]]; then
              echo "Expected a regular file for each completed snapshot artifact." >&2
              exit 1
            fi
          done
          git add -- "$snapshot.json" "$snapshot.md"
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: intel snapshot $SNAPSHOT_DATE"
          git pull --rebase origin main
          git push origin HEAD:refs/heads/main
