name: Morning Intel

# Daily interpreted report (GA4 + checkout + Mission Control + errors) for
# both brands → gravelgodcoaching@gmail.com, with snapshots committed to
# the morning-intel-state branch so trends compound. Spec: docs/specs/daily-intel-report.md

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 06:00 MT
  workflow_dispatch:

concurrency:
  group: morning-intel-publication
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  intel:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      snapshot-date: ${{ steps.snapshot.outputs.snapshot_date }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet google-analytics-data supabase python-dotenv
      - name: Run Morning Intel
        id: snapshot
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
          GG_GA4_PROPERTY_ID: ${{ secrets.GG_GA4_PROPERTY_ID }}
          RL_GA4_PROPERTY_ID: ${{ secrets.RL_GA4_PROPERTY_ID }}
          XC_GA4_PROPERTY_ID: ${{ secrets.XC_GA4_PROPERTY_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GH_TOKEN: ${{ github.token }}
        # One surface: the Morning Console (12:45 UTC) reads this snapshot and
        # emails the single daily digest. This job no longer emails.
        run: bash scripts/with-google-credentials.sh python3 scripts/daily_intel.py --no-email --github-output "$GITHUB_OUTPUT"
      - name: Stage validated aggregate files
        env:
          SNAPSHOT_DATE: ${{ steps.snapshot.outputs.snapshot_date }}
        run: python3 scripts/stage_intel_snapshot.py data/intel-snapshots "$RUNNER_TEMP/intel-review" "$SNAPSHOT_DATE"
      - name: Transfer the aggregate snapshot
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intel-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intel-review
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: intel
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Require the source artifact
        env:
          ARTIFACT_ID: ${{ needs.intel.outputs.artifact-id }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "Missing aggregate snapshot artifact." >&2
            exit 1
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.intel.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/intel-review
      - name: Publish the validated snapshot on the data branch
        shell: bash
        env:
          MONITORING_STATE_DIR: ${{ runner.temp }}/morning-intel-state
          SNAPSHOT_DATE: ${{ needs.intel.outputs.snapshot-date }}
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          bash scripts/daily-monitoring-state.sh prepare intel
          python3 scripts/stage_intel_snapshot.py "$RUNNER_TEMP/intel-review" \
            "$MONITORING_STATE_DIR/data/intel-snapshots" "$SNAPSHOT_DATE"
          bash scripts/daily-monitoring-state.sh publish intel
