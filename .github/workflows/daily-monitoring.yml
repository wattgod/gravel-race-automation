name: Daily Monitoring

on:
  schedule:
    # Run once daily at 6 AM UTC (consolidates gsc-monitor, cwv-monitor, daily-marketing-report)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install google-api-python-client google-auth google-analytics-data requests pyyaml

      - name: GSC monitoring
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: bash scripts/with-google-credentials.sh python scripts/gsc_tracker.py --snapshot --report --alert

      - name: CWV monitoring
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: python scripts/cwv_monitor.py --snapshot --report --alert

      - name: Marketing report
        id: marketing
        run: |
          mkdir -p reports
          report="reports/$(date -u +%Y-%m-%d).md"
          bash scripts/with-google-credentials.sh python scripts/daily-marketing-report.py --output "$report"
          printf 'report=%s\n' "$report" >> "$GITHUB_OUTPUT"
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}

      - name: Commit changes
        env:
          REPORT_PATH: ${{ steps.marketing.outputs.report }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/gsc-snapshots/ data/cwv-snapshots/ "$REPORT_PATH"
          git diff --cached --quiet || git commit -m "chore: daily monitoring $(date +%Y-%m-%d)"
          git push
