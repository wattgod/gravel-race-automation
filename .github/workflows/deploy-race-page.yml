name: Deploy Race Page

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate prepares reviewable artifacts without SSH; publish releases the same validated bytes
        type: choice
        options: [validate, publish]
        default: validate
        required: true
      scope:
        description: One canonical race or the complete active race catalog
        type: choice
        options: [single, all]
        default: all
        required: true
      slug:
        description: Canonical race slug; required only for single scope
        required: false
        type: string

permissions:
  contents: read

# Publish serializes with the broad publishing workflow. Validation has its
# own group so it cannot cancel a pending publish. Remote locks remain intact.
concurrency:
  group: ${{ inputs.mode == 'publish' && 'publish-site' || format('validate-race-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Reject publishing outside main
        env:
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_MODE" == publish ]]; then
            test "$GITHUB_REF" = refs/heads/main
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Define fresh runner output location
        run: |
          set -euo pipefail
          echo "RELEASE_DIR=$RUNNER_TEMP/gg-race-release" >> "$GITHUB_ENV"
      - name: Check storage before installation or tests
        run: |
          set -euo pipefail
          python -c 'from scripts.prepare_race_release import disk_guard; disk_guard()'
      - name: Install validation dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Prepare exact scoped package and run required gates
        env:
          RELEASE_SCOPE: ${{ inputs.scope }}
          RACE_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          args=(prepare --release-dir "$RELEASE_DIR" --scope "$RELEASE_SCOPE")
          if [[ -n "$RACE_SLUG" ]]; then args+=(--slug "$RACE_SLUG"); fi
          python scripts/prepare_race_release.py "${args[@]}"
      - name: Preserve public package and validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gg-race-release/package/
            ${{ runner.temp }}/gg-race-release/receipts/
          if-no-files-found: warn
      - name: Configure SSH only after successful gates
        if: inputs.mode == 'publish'
        env:
          DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test -n "$DEPLOY_KEY"
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_PORT"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/siteground_key
          chmod 600 ~/.ssh/siteground_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Publish only validated races and verify exact live bytes
        if: inputs.mode == 'publish'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          python scripts/prepare_race_release.py publish --release-dir "$RELEASE_DIR"
      - name: Preserve live verification receipt
        if: always() && inputs.mode == 'publish'
        uses: actions/upload-artifact@v4
        with:
          name: race-release-live-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gg-race-release/receipts/live-verification.json
          if-no-files-found: warn
      - name: Remove owned runner SSH key
        if: always() && inputs.mode == 'publish'
        run: |
          set -euo pipefail
          rm -f ~/.ssh/siteground_key
