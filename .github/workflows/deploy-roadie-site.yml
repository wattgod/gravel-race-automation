name: Deploy Roadie Site

# Manual button: rebuilds every roadielabs.com page that carries the shared
# site header (race pages, vs/state/tier hubs, calendar, power rankings,
# methodology, prep-kit index, training-plan pages, and the top-level pages) from
# road-race-automation main and pushes them with its own deploy script.
# A change to wordpress/shared_header.py (inline header CSS on some pages,
# the content-hashed /race/assets/rl-styles.<hash>.css on the rest) reaches
# visitors only when every page is regenerated and pushed together.
#
# Secrets (already in this repo, see deploy-coaching-pages.yml):
#   RL_SSH_HOST/RL_SSH_USER/RL_SSH_PORT/RL_SSH_PRIVATE_KEY  roadielabs.com
#   GH_PAT  read access to wattgod/road-race-automation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-roadie-site
  cancel-in-progress: false

jobs:
  roadie:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SSH_HOST: ${{ secrets.RL_SSH_HOST }}
      SSH_USER: ${{ secrets.RL_SSH_USER }}
      SSH_PORT: ${{ secrets.RL_SSH_PORT }}
      STAGE: wordpress/output-site-stage
    steps:
      - name: Only deploy from main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: wattgod/road-race-automation
          ref: main
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.RL_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"; test -n "$SSH_HOST"; test -n "$SSH_USER"; test -n "$SSH_PORT"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/roadlabs_key
          chmod 600 ~/.ssh/roadlabs_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          test -s ~/.ssh/known_hosts
      - name: Build pages
        run: |
          set -euo pipefail
          # Race pages and the /race/ hubs go to a dedicated dir: --sync-pages
          # globs *.html and would otherwise sweep up homepage.html etc.
          python3 wordpress/generate_neo_brutalist.py --all --output-dir "$STAGE"
          for g in state_hubs vs_pages tier_hubs calendar power_rankings; do
            python3 "wordpress/generate_$g.py" --output-dir "$STAGE"
          done
          # --sync-pages refuses without every race page's prep kit and ships them with it.
          python3 wordpress/generate_prep_kit.py --all
          python3 wordpress/generate_training_plan_pages.py --all
          for g in methodology homepage about coaching consulting courses_page insights \
                   training_plans legal_pages success_pages coaching_apply consult_intake \
                   questionnaire exit_interview goals_2027 race_debrief; do
            python3 "wordpress/generate_$g.py"
          done
          python3 scripts/build_search_page.py
          # /race/methodology/ (the "How We Rate" link) ships with --sync-pages;
          # --sync-methodology covers /methodology/.
          cp wordpress/output/methodology.html "$STAGE"/methodology.html
          ls "$STAGE"/assets/
      # Required before every deploy (CLAUDE.md / AGENTS.md).
      - name: Run pre-deploy quality gate
        run: python3 scripts/preflight_quality.py
      - name: Push pages
        run: |
          python3 scripts/push_wordpress.py \
            --sync-pages --pages-dir "$STAGE" --sync-prep-kits --sync-plan-pages \
            --sync-methodology --sync-homepage --sync-about --sync-coaching --sync-consulting \
            --sync-courses-page --sync-insights --sync-training-plans --sync-legal --sync-success \
            --sync-coaching-apply --sync-consult-intake --sync-questionnaire \
            --sync-exit-interview --sync-goals --sync-race-debrief --sync-widget \
            --purge-cache
      - name: Check the deployed header
        run: |
          set -euo pipefail
          # Verified on the server over SSH: SiteGround answers GitHub runners
          # with its bot challenge (HTTP 202, ~200 bytes) instead of the page,
          # so an HTTP check from here can never see the site.
          base=$(python3 -c "import sys; sys.path.insert(0, 'scripts'); import push_wordpress as p; print(p.REMOTE_BASE)")
          css=$(basename "$(find "$STAGE/assets" -name "rl-styles.*.css" -print -quit)")
          slug=$(basename "$(find "$STAGE" -maxdepth 1 -name "*.html" ! -name methodology.html -print -quit)" .html)
          fail=0
          for path in / /about/ /coaching/ /consulting/ /courses/ /insights/ /training-plans/ /road-races/ \
                      /privacy/ /questionnaire/ /coaching/apply/ /methodology/ /race/methodology/ /prep-kit/ /race/calendar/2027/ \
                      "/race/$slug/" "/race/$slug/training-plan/"; do
            rm -f live.html
            if ! scp -q -i ~/.ssh/roadlabs_key -P "$SSH_PORT" "$SSH_USER@$SSH_HOST:$base${path}index.html" live.html; then
              echo "deployed page missing: $path"; fail=1; continue
            fi
            # Menu icon CSS (inline or the new hashed file) AND the bind-once tap script.
            if { grep -qF 'rl-site-header-toggle span { display: block; flex: none;' live.html \
                 || grep -qF "/race/assets/$css" live.html; } \
               && grep -qF 'data-rl-nav-bound' live.html; then
              echo "deployed ok: $path"
            else
              echo "deployed header not updated: $path"; fail=1
            fi
          done
          rm -f live.css
          scp -q -i ~/.ssh/roadlabs_key -P "$SSH_PORT" "$SSH_USER@$SSH_HOST:$base/race/assets/$css" live.css || true
          grep -qF 'flex: none; width: 20px; height: 2px' live.css 2>/dev/null || { echo "deployed $css missing or lacks the menu icon fix"; fail=1; }
          exit $fail
