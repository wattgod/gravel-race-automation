name: Fast Process Races (2-4 Days)

on:
  # PAUSED: Schedule disabled until API keys/credits are fixed
  # schedule:
  #   # Run every 6 minutes (10 races per hour = 240/day = ~1.6 days for all)
  #   - cron: '*/6 * * * *'
  workflow_dispatch:
    inputs:
      tier:
        description: 'Which tier to process'
        required: true
        default: '2'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - 'all'
      limit:
        description: 'Max races per run'
        required: false
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_work: ${{ steps.set-matrix.outputs.has_work }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Build race matrix
        id: set-matrix
        env:
          PROCESS_TIER: ${{ github.event.inputs.tier || '2' }}
          PROCESS_LIMIT: ${{ github.event.inputs.limit || '1' }}
        run: |
          python3 << 'EOF'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from auto_process_review import completed_races, validate_matrix
          
          with open("db/gravel_races_full_database.json") as f:
              db = json.load(f)
          
          tier = os.environ["PROCESS_TIER"]
          limit = int(os.environ["PROCESS_LIMIT"] or 1)
          
          if tier != "all":
              races = [r for r in db.get("races", []) if str(r.get("TIER", "")) == tier]
          else:
              races = db.get("races", [])
          
          # Filter out already processed
          processed = completed_races(Path.cwd())
          
          races = [r for r in races if r.get("RACE_NAME", "") not in processed]
          
          # Take next N races
          if limit > 0:
              races = races[:limit]
          
          if not races:
              print("No races to process")
              matrix = {"include": []}
          else:
              matrix = {
                  "include": [
                      {
                          "race_name": r.get("RACE_NAME", ""),
                          "folder": r.get("RACE_NAME", "").lower().replace(" ", "-").replace("'", "").replace(",", "").replace(".", "")
                      }
                      for r in races
                  ]
              }
          
          validate_matrix(matrix)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"has_work={str(bool(matrix['include'])).lower()}\n")
              out.write(f"matrix={json.dumps(matrix)}\n")
          print(f"Processing {len(matrix.get('include', []))} races")
          EOF

  process:
    needs: prepare
    if: needs.prepare.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      max-parallel: 1
      fail-fast: false
    
    env:
      RACE_NAME: ${{ matrix.race_name }}
      RACE_FOLDER: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - run: pip install anthropic requests pyyaml python-frontmatter
      
      - name: Process ${{ matrix.race_name }}
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        timeout-minutes: 10
        run: |
          rm -f -- "research-dumps/${RACE_FOLDER}-raw.md" "briefs/${RACE_FOLDER}-brief.md" "landing-pages/${RACE_FOLDER}.json"
          echo "Processing: ${RACE_NAME}"
          
          # Use Perplexity for research (better quality)
          python scripts/research_perplexity.py \
            --race "${RACE_NAME}" \
            --folder "${RACE_FOLDER}" || \
          python scripts/research.py \
            --race "${RACE_NAME}" \
            --folder "${RACE_FOLDER}"
          
          python scripts/synthesize.py \
            --input "research-dumps/${RACE_FOLDER}-raw.md" \
            --output "briefs/${RACE_FOLDER}-brief.md"
          
          python scripts/generate_json.py \
            --input "briefs/${RACE_FOLDER}-brief.md" \
            --output "landing-pages/${RACE_FOLDER}.json"
          
          # Quality gates (non-blocking)
          python scripts/quality_gates.py \
            --file "research-dumps/${RACE_FOLDER}-raw.md" \
            --type research || true
          
          python scripts/quality_gates.py \
            --file "briefs/${RACE_FOLDER}-brief.md" \
            --type brief || true

      - name: Stage and scan race research
        uses: ./.github/actions/stage-race-review
        with:
          folder: ${{ matrix.folder }}

  publish:
    needs: [prepare, process]
    if: "!cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.has_work == 'true'"
    permissions:
      contents: write
    uses: ./.github/workflows/publish-race-review.yml
    with:
      race_matrix: ${{ needs.prepare.outputs.matrix }}
      review_kind: fast-process-races
