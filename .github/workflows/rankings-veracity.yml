name: "Rankings Veracity Check"

# The race-content freshness loop, RATINGS tier (sibling of weekly-fact-refresh,
# which owns dates/status via official-site scraping):
#   cheap agents (Haiku + web search) verify the objective vitals behind each
#   race's rating (distance, elevation, field size, purse, cost, alive/dead) →
#   high-confidence mismatches auto-fixed → Length/Elevation/Altitude criterion
#   scores recomputed from the published rubric → overall score + tier
#   recomputed → gates → review branch + notification issue.
#
# Guardrails:
#   - Whitelisted FACT fields only; subjective criteria (prestige, community,
#     experience...) are never touched
#   - status (cancelled/defunct) is FLAG-ONLY — never auto-applied
#   - Tier changes are applied (pure rubric math) but flagged loudly
#   - Anomaly brake: >10 changed profiles → issue instead of commit
#   - Source priority, flagship-course scope, change limits and unit checks
#     live in scripts/veracity_guards.py (after the 2026-10-01/10-08 runs
#     wrote a Leadville fire reroute, a Dotwatcher elevation and shorter
#     course options onto profiles). Over-limit changes (distance/elevation
#     >15%, score move of 2+, non-official source) never touch main: they go
#     to a separate review branch with old/new/source in the review issue.
#   - Derived data: the script regenerates web/race-index.json + web/jsonld
#     after any profile edit, and the index-integrity tests gate every push.
#     If a gate fails, the run fails and holds changes for review.
#   - Budget: ~$0.04/race (Haiku + <=4 web searches). 25 races weekly ≈
#     $4-5/mo; full 757-race sweep ≈ 30 weeks.

on:
  schedule:
    # Thursdays 14:00 UTC — offset from the Tuesday fact refresh
    - cron: '0 14 * * 4'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Races per run'
        required: false
        default: '25'
        type: string
      dry_run:
        description: 'Report only, do not modify race-data'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

env:
  REVIEW_LABEL: needs-human-review

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install anthropic pytest pyyaml

      - name: Verify rankings facts
        id: verify
        # A crash or index drift must not skip the gates below; the final
        # step fails the job if this step failed.
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VERIFY_LIMIT: ${{ inputs.limit || '25' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--limit "$VERIFY_LIMIT" --review-queue "$RUNNER_TEMP/review_queue.json")
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          python scripts/verify_race_rankings.py "${args[@]}"

      - name: Count changed profiles
        id: changes
        run: |
          set -o pipefail
          CHANGED=$(git status --porcelain --untracked-files=all -- race-data/ | wc -l | tr -d ' ')
          echo "count=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Changed profiles: $CHANGED"
          if [ -s "$RUNNER_TEMP/review_queue.json" ]; then echo "review=true" >> "$GITHUB_OUTPUT"; fi

      - name: Verification gates (index integrity before any commit)
        id: gates
        if: steps.changes.outputs.count != '0'
        continue-on-error: true
        run: |
          python -m pytest -q \
            tests/test_verify_race_rankings.py tests/test_veracity_guards.py \
            tests/test_index_integrity.py tests/test_tier_integrity.py \
            tests/test_profile_integrity.py tests/test_dates.py
          python scripts/validate_citations.py > /dev/null

      - name: Anomaly brake — too many changes
        if: steps.changes.outputs.count > 10 && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --stat race-data/ > /tmp/diffstat.txt
          gh issue create \
            --title "Rankings veracity anomaly: ${{ steps.changes.outputs.count }} profiles changed in one run" \
            --body "$(printf 'The veracity check changed more than 10 profiles, exceeding the anomaly brake. Nothing was committed — review the run logs.\n\n```\n%s\n```' "$(cat /tmp/diffstat.txt)")"
          echo "::warning::Anomaly brake tripped — issue opened, no commit"

      - name: Publish rankings and rotation state for review
        if: >-
          !cancelled() && inputs.dry_run != true && steps.changes.outputs.count <= 10
          && (steps.changes.outputs.count != '0' || steps.verify.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          GATES_OUTCOME: ${{ steps.gates.outcome }}
        run: |
          git add -- race-data/ data/verification/ web/race-index.json web/jsonld/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "rankings-veracity-bot"
          git config user.email "veracity@gravelgodcycling.com"
          status="rankings"
          if [[ "$VERIFY_OUTCOME" == failure || "$GATES_OUTCOME" == failure ]]; then
            status="held"
            subject="veracity: rankings held after verification failure ($(date +%F))"
            gh label create "$REVIEW_LABEL" --color d93f0b --description "Bot change held for a human" --force
            labels=(--label "$REVIEW_LABEL")
          else
            subject=$(python scripts/verify_race_rankings.py --commit-message data/verification/last_run_report.json)
            labels=()
          fi
          branch="review/veracity/$status/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git commit -m "$subject"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$branch"
          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          body="Verification: $VERIFY_OUTCOME. Integrity gates: $GATES_OUTCOME. Review the branch and open a pull request to run normal CI. The branch contains the verification report and rotation state."
          printf '%s\n\n[Compare with main](%s)\n' "$body" "$compare" >> "$GITHUB_STEP_SUMMARY"
          gh issue create --title "$subject" --body "$body

          $compare" "${labels[@]}"

      - name: Apply and verify over-limit changes
        id: over_limit
        if: >-
          !cancelled() && inputs.dry_run != true && steps.changes.outputs.review == 'true'
          && steps.changes.outputs.count <= 10 && steps.verify.outcome == 'success'
          && steps.gates.outcome != 'failure'
        run: |
          review_checkout="$RUNNER_TEMP/veracity-over-limit"
          git worktree add --detach "$review_checkout" "$GITHUB_SHA"
          cd "$review_checkout"
          python scripts/verify_race_rankings.py \
            --apply-review-queue "$RUNNER_TEMP/review_queue.json" \
            --pr-body "$RUNNER_TEMP/review-pr-body.md"
          if [[ -z "$(git status --porcelain -- race-data/)" ]]; then
            echo "Review queue produced no profile changes"; exit 0
          fi
          python -m pytest -q tests/test_index_integrity.py tests/test_tier_integrity.py tests/test_profile_integrity.py
          echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Over-limit changes — publish a separate review branch
        if: "!cancelled() && steps.over_limit.outputs.changes == 'true'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/veracity-over-limit"
          git add -- race-data/ web/race-index.json web/jsonld/
          git config user.name "rankings-veracity-bot"
          git config user.email "veracity@gravelgodcycling.com"
          subject="veracity: review over-limit rankings changes ($(date +%F))"
          git commit -m "$subject"
          branch="review/veracity/over-limit/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh label create "$REVIEW_LABEL" --color d93f0b --description "Bot change held for a human" --force
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$branch"
          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          printf '[Compare over-limit changes with main](%s)\n' "$compare" >> "$GITHUB_STEP_SUMMARY"
          printf '\n[Open a pull request for normal CI](%s)\n' "$compare" >> "$RUNNER_TEMP/review-pr-body.md"
          gh issue create --title "$subject" --label "$REVIEW_LABEL" --body-file "$RUNNER_TEMP/review-pr-body.md"

      - name: Fail the run if verification or gates failed
        if: always() && (steps.verify.outcome == 'failure' || steps.gates.outcome == 'failure')
        run: |
          echo "::error::Verification failed. See the run summary for any held branch."
          exit 1
