name: Re-Enrich Race Profiles

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Enrichment mode'
        required: true
        default: 'worst'
        type: choice
        options:
          - worst
          - force
          - slugs
      count:
        description: 'Number of races to enrich'
        required: false
        default: '10'
        type: string
      slugs:
        description: 'Comma-separated slugs (only used when mode=slugs)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ENRICH_MODE: ${{ inputs.mode }}
      ENRICH_COUNT: ${{ inputs.count }}
      ENRICH_SLUGS: ${{ inputs.slugs }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic requests pyyaml python-dotenv python-frontmatter

      - name: Run enrichment (worst)
        if: ${{ inputs.mode == 'worst' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/batch_enrich.py --auto "$ENRICH_COUNT"

      - name: Run enrichment (force)
        if: ${{ inputs.mode == 'force' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/batch_enrich.py --force --auto "$ENRICH_COUNT"

      - name: Run enrichment (slugs)
        if: ${{ inputs.mode == 'slugs' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          slug_list=${ENRICH_SLUGS//,/ }
          read -r -a slugs <<< "${slug_list//$'\n'/ }"
          if (( ${#slugs[@]} == 0 )); then
            echo "Enter at least one race slug." >&2
            exit 1
          fi
          for slug in "${slugs[@]}"; do
            if [[ ! "$slug" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "Each race slug must contain only lowercase letters, numbers, and dashes." >&2
              exit 1
            fi
          done
          python scripts/batch_enrich.py --slugs "${slugs[@]}"

      - name: Validate citations
        run: |
          python scripts/validate_citations.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: re-enrich race profiles (${ENRICH_MODE}, ${ENRICH_COUNT})"
          git push
