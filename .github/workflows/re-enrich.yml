name: Re-Enrich Race Profiles

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Enrichment mode'
        required: true
        default: 'worst'
        type: choice
        options:
          - worst
          - force
          - slugs
      count:
        description: 'Number of races to enrich'
        required: false
        default: '10'
        type: string
      slugs:
        description: 'Comma-separated slugs (only used when mode=slugs)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  enrich:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ENRICH_MODE: ${{ inputs.mode }}
      ENRICH_COUNT: ${{ inputs.count }}
      ENRICH_SLUGS: ${{ inputs.slugs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install anthropic requests pyyaml python-dotenv python-frontmatter

      - name: Run enrichment (worst)
        if: ${{ inputs.mode == 'worst' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/batch_enrich.py --auto "$ENRICH_COUNT"

      - name: Run enrichment (force)
        if: ${{ inputs.mode == 'force' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/batch_enrich.py --force --auto "$ENRICH_COUNT"

      - name: Run enrichment (slugs)
        if: ${{ inputs.mode == 'slugs' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          slug_list=${ENRICH_SLUGS//,/ }
          read -r -a slugs <<< "${slug_list//$'\n'/ }"
          if (( ${#slugs[@]} == 0 )); then
            echo "Enter at least one race slug." >&2
            exit 1
          fi
          slug_pattern='^[a-z0-9][a-z0-9()-]*$'
          for slug in "${slugs[@]}"; do
            if [[ ! "$slug" =~ $slug_pattern ]]; then
              echo "Use lowercase letters, numbers, dashes, or parentheses in race slugs." >&2
              exit 1
            fi
          done
          python scripts/batch_enrich.py --slugs "${slugs[@]}"

      - name: Validate citations
        run: |
          python scripts/validate_citations.py

      - name: Publish changes for review
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git diff --cached --exit-code --quiet
          git ls-files -z --cached --others --exclude-standard -- ':(glob)race-data/*.json' ':(glob)data/enrichment-snapshots/*-pre.json' |
            git --literal-pathspecs add -A --pathspec-from-file=- --pathspec-file-nul
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          branch="review/re-enrich/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: re-enrich race profiles (${ENRICH_MODE}, ${ENRICH_COUNT})"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push origin "HEAD:refs/heads/$branch"
          review_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          printf 'Review the proposed updates in a [pull request](%s).\n' "$review_url" >> "$GITHUB_STEP_SUMMARY"
