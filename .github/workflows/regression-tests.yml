name: Regression Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install anthropic requests python-frontmatter pyyaml
      
      - name: Run Regression Tests
        run: |
          python scripts/regression_test.py

      # Stdlib only; runs even if the step above fails. Any truncated,
      # scrape-broken or unterminated string in race-data (the class PR #448
      # cleaned up) fails this check on every PR and every push to main.
      - name: Audit race-data text defects
        if: always()
        run: |
          python scripts/audit_text_defects.py --summary --fail
