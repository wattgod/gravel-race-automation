name: Research Gravel Race

on:
  # Manual trigger with race name input
  workflow_dispatch:
    inputs:
      race_name:
        description: 'Race name (e.g., "Unbound 200")'
        required: true
        type: string
      race_folder:
        description: 'Folder name (e.g., "unbound-200")'
        required: true
        type: string
      research_engine:
        description: 'Research engine'
        required: true
        default: 'perplexity'
        type: choice
        options:
          - perplexity
          - claude
      skip_validation:
        description: 'Skip validation step'
        required: false
        type: boolean
        default: false

  # Or trigger via repository dispatch (API call)
  repository_dispatch:
    types: [research-race]

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      RACE_NAME: ${{ github.event.inputs.race_name }}
      RACE_FOLDER: ${{ github.event.inputs.race_folder }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate race inputs
        shell: bash
        run: |
          if [[ -z "$RACE_NAME" || ! "$RACE_FOLDER" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Enter a race name and a lowercase race folder slug." >&2
            exit 1
          fi
      
      - name: Install dependencies
        run: |
          pip install anthropic requests python-frontmatter pyyaml
      
      - name: Run Research (Perplexity)
        if: ${{ github.event.inputs.research_engine == 'perplexity' }}
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          python scripts/research_perplexity.py \
            --race "${RACE_NAME}" \
            --folder "${RACE_FOLDER}"
      
      - name: Run Research (Claude)
        if: ${{ github.event.inputs.research_engine == 'claude' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/research.py \
            --race "${RACE_NAME}" \
            --folder "${RACE_FOLDER}"
      
      - name: Validate Research
        if: ${{ github.event.inputs.skip_validation != 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/validate.py \
            --input "research-dumps/${RACE_FOLDER}-raw.md"
        continue-on-error: true
      
      - name: Synthesize Brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/synthesize.py \
            --input "research-dumps/${RACE_FOLDER}-raw.md" \
            --output "briefs/${RACE_FOLDER}-brief.md"
      
      - name: Generate JSON
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/generate_json.py \
            --input "briefs/${RACE_FOLDER}-brief.md" \
            --output "landing-pages/${RACE_FOLDER}.json"
      
      - name: Quality Gate - Research
        run: |
          python scripts/quality_gates.py \
            --file "research-dumps/${RACE_FOLDER}-raw.md" \
            --type research \
            --strict
        continue-on-error: false
      
      - name: Quality Gate - Brief
        run: |
          python scripts/quality_gates.py \
            --file "briefs/${RACE_FOLDER}-brief.md" \
            --type brief \
            --strict
        continue-on-error: false
      
      - name: Validate Output Quality
        run: |
          python scripts/validate_output.py \
            --folder "${RACE_FOLDER}" \
            --strict
        continue-on-error: true
      
      - name: Commit Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add research-dumps/ briefs/ landing-pages/ data/
          git commit -m "Research + Brief: ${RACE_NAME}" || echo "No changes"
          git push

      - name: Push to WordPress
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          python scripts/push_wordpress.py \
            --json "landing-pages/${RACE_FOLDER}.json"
        continue-on-error: true
      
      - name: Notify Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          python scripts/notify.py \
            --race "${RACE_NAME}" \
            --status "complete"
        continue-on-error: true

