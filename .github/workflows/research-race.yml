name: Research Gravel Race

on:
  # Manual trigger with race name input
  workflow_dispatch:
    inputs:
      race_name:
        description: 'Race name (e.g., "Unbound 200")'
        required: true
        type: string
      race_folder:
        description: 'Folder name (e.g., "unbound-200")'
        required: true
        type: string
      research_engine:
        description: 'Research engine'
        required: true
        default: 'perplexity'
        type: choice
        options:
          - perplexity
          - claude
      skip_validation:
        description: 'Skip validation step'
        required: false
        type: boolean
        default: false

  # Or trigger via repository dispatch (API call)
  repository_dispatch:
    types: [research-race]

permissions:
  contents: read

jobs:
  research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.validate-inputs.outputs.matrix }}
      folder: ${{ steps.validate-inputs.outputs.folder }}
      race-name: ${{ steps.validate-inputs.outputs.race-name }}
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Validate race inputs
        id: validate-inputs
        shell: bash
        run: |
          python3 <<'PYTHON'
          import json
          import os
          import re
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from auto_process_review import validate_matrix

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          inputs = event.get("inputs") or event.get("client_payload") or {}
          if not isinstance(inputs, dict):
              sys.exit("Race inputs must be an object.")
          name = inputs.get("race_name")
          folder = inputs.get("race_folder") or inputs.get("folder")
          engine = inputs.get("research_engine") or "perplexity"
          skip = str(inputs.get("skip_validation", False)).lower()
          if not isinstance(name, str) or "\x00" in name:
              sys.exit("Enter a race name.")
          if not isinstance(folder, str) or not re.fullmatch(r"[a-z0-9][a-z0-9()-]{0,100}", folder):
              sys.exit("Enter a folder slug using lowercase letters, numbers, dashes, or parentheses.")
          if engine not in ("perplexity", "claude"):
              sys.exit("Unknown research provider.")
          if skip not in {"true", "false"}:
              sys.exit("The skip validation input must be true or false.")
          matrix = {"include": [{"race_name": name, "folder": folder}]}
          validate_matrix(matrix)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={json.dumps(matrix)}\nfolder={folder}\nrace-name={name}\n")
              out.write(f"engine={engine}\nskip-validation={skip}\n")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"RACE_NAME={name}\nRACE_FOLDER={folder}\n")
          PYTHON
      
      - name: Install dependencies
        run: |
          pip install -c requirements.txt anthropic requests python-frontmatter pyyaml

      - name: Clear stale outputs
        run: |
          rm -f -- "research-dumps/${RACE_FOLDER}-raw.md" "briefs/${RACE_FOLDER}-brief.md" "landing-pages/${RACE_FOLDER}.json"

      - name: Run Research (Perplexity)
        if: steps.validate-inputs.outputs.engine == 'perplexity'
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          python scripts/research_perplexity.py \
            --race "${RACE_NAME}" \
            --folder "${RACE_FOLDER}"
      
      - name: Run Research (Claude)
        if: steps.validate-inputs.outputs.engine == 'claude'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/research.py \
            --race "${RACE_NAME}" \
            --folder "${RACE_FOLDER}"
      
      - name: Validate Research
        if: steps.validate-inputs.outputs.skip-validation != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/validate.py \
            --input "research-dumps/${RACE_FOLDER}-raw.md"
        continue-on-error: true
      
      - name: Synthesize Brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/synthesize.py \
            --input "research-dumps/${RACE_FOLDER}-raw.md" \
            --output "briefs/${RACE_FOLDER}-brief.md"
      
      - name: Generate JSON
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/generate_json.py \
            --input "briefs/${RACE_FOLDER}-brief.md" \
            --output "landing-pages/${RACE_FOLDER}.json"
      
      - name: Quality Gate - Research
        run: |
          python scripts/quality_gates.py \
            --file "research-dumps/${RACE_FOLDER}-raw.md" \
            --type research \
            --strict
        continue-on-error: false
      
      - name: Quality Gate - Brief
        run: |
          python scripts/quality_gates.py \
            --file "briefs/${RACE_FOLDER}-brief.md" \
            --type brief \
            --strict
        continue-on-error: false
      
      - name: Validate Output Quality
        run: |
          python scripts/validate_output.py \
            --folder "${RACE_FOLDER}" \
            --strict
        continue-on-error: true
      
      - name: Stage and scan race research
        uses: ./.github/actions/stage-race-review
        with:
          folder: ${{ steps.validate-inputs.outputs.folder }}

  publish:
    needs: research
    permissions:
      contents: write
    uses: ./.github/workflows/publish-race-review.yml
    with:
      race_matrix: ${{ needs.research.outputs.matrix }}
      review_kind: research-race

  stage-draft:
    needs: [research, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install -c requirements.txt requests python-dotenv pyyaml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: race-output-${{ needs.research.outputs.folder }}
          path: ${{ runner.temp }}/reviewed-race
      - name: Stage WordPress draft
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          RACE_FOLDER: ${{ needs.research.outputs.folder }}
        run: |
          python scripts/push_wordpress.py \
            --json "$RUNNER_TEMP/reviewed-race/landing-pages/${RACE_FOLDER}.json"
        continue-on-error: true
      
      - name: Notify Slack
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          RACE_NAME: ${{ needs.research.outputs.race-name }}
        run: |
          python scripts/notify.py \
            --race "${RACE_NAME}" \
            --status "complete"
        continue-on-error: true

