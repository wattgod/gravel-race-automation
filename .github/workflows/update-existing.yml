name: Weekly Refresh Existing Races

# NOTE (2026-07-13): the previous version was an INVALID workflow file —
# `strategy`/`matrix` were placed on a *step* (they are job-level only) and it
# used the `::set-output` command GitHub disabled in 2023. GitHub therefore
# rejected it on EVERY push ("workflow file issue" / "No jobs were run"),
# spamming failed-run emails. Rewritten with a job-level matrix.
#
# The weekly schedule stays disabled. Manual runs use live Anthropic calls
# and stage their generated output for review.

on:
  # schedule:
  #   - cron: '0 2 * * 1'   # Mondays 02:00 UTC — re-enable after verifying scripts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find-races:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Find races with briefs older than 30 days
        id: find
        run: |
          python3 << 'EOF'
          import json
          import os
          import sys
          from datetime import datetime
          sys.path.insert(0, "scripts")
          from auto_process_review import validate_matrix

          races = []
          briefs_dir = "briefs"
          if os.path.exists(briefs_dir):
              for f in os.listdir(briefs_dir):
                  if f.endswith("-brief.md"):
                      age_days = (datetime.now().timestamp()
                                  - os.path.getmtime(os.path.join(briefs_dir, f))) / 86400
                      if age_days > 30:
                          folder = f.removesuffix("-brief.md")
                          races.append({
                              "race_name": folder.replace("-", " ").title(),
                              "folder": folder,
                          })

          races = races[:10]  # cap per run
          matrix = {"include": races}
          validate_matrix(matrix)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"matrix={json.dumps(matrix)}\n")
              out.write(f"count={len(races)}\n")
          print(f"Found {len(races)} races to refresh")
          EOF

  refresh:
    needs: find-races
    if: ${{ needs.find-races.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix: ${{ fromJson(needs.find-races.outputs.matrix) }}
    env:
      RACE_NAME: ${{ matrix.race_name }}
      RACE_FOLDER: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: pip install anthropic requests pyyaml python-frontmatter
      - name: Refresh ${{ matrix.race_name }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          rm -f -- "research-dumps/${RACE_FOLDER}-raw.md" "briefs/${RACE_FOLDER}-brief.md" "landing-pages/${RACE_FOLDER}.json"
          python scripts/research.py \
            --race "${RACE_NAME}" \
            --folder "${RACE_FOLDER}"
          python scripts/synthesize.py \
            --input "research-dumps/${RACE_FOLDER}-raw.md" \
            --output "briefs/${RACE_FOLDER}-brief.md"
          python scripts/generate_json.py \
            --input "briefs/${RACE_FOLDER}-brief.md" \
            --output "landing-pages/${RACE_FOLDER}.json"
      - name: Stage and scan race research
        uses: ./.github/actions/stage-race-review
        with:
          folder: ${{ matrix.folder }}

  publish:
    needs: [find-races, refresh]
    if: "!cancelled() && needs.find-races.result == 'success' && needs.find-races.outputs.count != '0'"
    permissions:
      contents: write
    uses: ./.github/workflows/publish-race-review.yml
    with:
      race_matrix: ${{ needs.find-races.outputs.matrix }}
      review_kind: update-existing
