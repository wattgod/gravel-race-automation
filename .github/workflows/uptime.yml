name: Uptime

# Every 10 minutes: the three brand home pages, the checkout API and Mission
# Control /health, and the intake Workers (sweep ALL-06, Nov 2026). An outage
# opens one issue labelled "uptime" and emails gravelgodcoaching@gmail.com
# once; recovery closes the issue and emails once more. Mission Control email
# delivery (/health/jobs) has its own incident and a 24-hour reminder. See
# scripts/uptime_check.py. GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_jobs_email:
        description: "Send a labeled Mission Control test email"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  uptime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scripts/uptime_check.py
          sparse-checkout-cone-mode: false
      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_JOBS_EMAIL: ${{ inputs.test_jobs_email }}
        run: |
          if [ "$TEST_JOBS_EMAIL" = "true" ]; then
            python3 scripts/uptime_check.py --test-jobs-email
          else
            python3 scripts/uptime_check.py
          fi
