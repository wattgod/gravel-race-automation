name: "Gravel Weekly Publish"

# Evidence collection and editorial preparation happen in the separate
# race-intelligence control plane every Friday. This workflow is deliberately
# manual: a model draft cannot become Matti's published opinion because a cron
# fired. Commit a schema-valid, status=published issue snapshot, then dispatch
# this workflow with that issue date.

on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: "Approved issue date (YYYY-MM-DD)"
        required: true
        type: string
      send_email:
        description: "Send this issue to the existing Gravel TV/Weekly audience"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: gravel-weekly-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the canonical main branch
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          if [[ "$DEPLOY_REF" != "refs/heads/main" ]]; then
            echo "::error::Gravel Weekly publication must run from main, not $DEPLOY_REF"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify selected issue is approved for publication
        id: issue
        env:
          ISSUE_DATE: ${{ inputs.issue_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.validate_gravel_weekly import validate_issue
          from scripts.validate_gravel_weekly_decisions import validate_decision_receipt

          issue_date = os.environ["ISSUE_DATE"]
          path = Path("data/gravel-weekly/issues") / f"{issue_date}.json"
          decision_path = Path("data/gravel-weekly/decisions") / f"{issue_date}.json"
          if not path.exists():
              raise SystemExit(f"Approved issue not found: {path}")
          if not decision_path.exists():
              raise SystemExit(f"Editorial decision receipt not found: {decision_path}")
          issue = validate_issue(json.loads(path.read_text()))
          if issue["status"] != "published":
              raise SystemExit("Workflow requires status=published; model drafts and prepared issues cannot deploy")
          validate_decision_receipt(json.loads(decision_path.read_text()), issue)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"hash={issue['contentHash']}\n")
              output.write(f"number={issue['issueNumber']}\n")
          PY

      - name: Record human editorial decisions and approved-copy feedback
        env:
          ISSUE_DATE: ${{ inputs.issue_date }}
          CONTROL_PLANE_INGEST_SECRET: ${{ secrets.CONTROL_PLANE_INGEST_SECRET }}
        run: |
          python scripts/record_gravel_weekly_decisions.py \
            "data/gravel-weekly/decisions/$ISSUE_DATE.json" \
            "data/gravel-weekly/issues/$ISSUE_DATE.json"

      - name: Record immutable correction learning receipts
        env:
          ISSUE_DATE: ${{ inputs.issue_date }}
          CONTROL_PLANE_INGEST_SECRET: ${{ secrets.CONTROL_PLANE_INGEST_SECRET }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python scripts/record_gravel_weekly_learning.py \
            "data/gravel-weekly/issues/$ISSUE_DATE.json" \
            --source-commit "$SOURCE_COMMIT"

      - name: Generate publication and homepage
        run: |
          python wordpress/generate_gravel_weekly.py
          python wordpress/generate_homepage.py

      - name: Verify publication infrastructure
        env:
          ISSUE_DATE: ${{ inputs.issue_date }}
          ISSUE_HASH: ${{ steps.issue.outputs.hash }}
        run: |
          python -m pytest tests/test_gravel_weekly.py -q
          grep -q "G-EJJZ9T6M52" wordpress/output/gravel-weekly.html
          grep -q "gravel-weekly-content-hash: $ISSUE_HASH" wordpress/output/gravel-weekly.html
          grep -q "gravel-weekly-content-hash: $ISSUE_HASH" "wordpress/output/gravel-weekly/$ISSUE_DATE/index.html"
          python scripts/preflight_quality.py

      - name: Build issue-specific race-impact review
        env:
          ISSUE_DATE: ${{ inputs.issue_date }}
        run: |
          python scripts/render_gravel_weekly_race_impact_review.py \
            "data/gravel-weekly/issues/$ISSUE_DATE.json" \
            --output artifacts/gravel-weekly-race-impact-review.md

      - uses: actions/upload-artifact@v4
        with:
          name: gravel-weekly-${{ inputs.issue_date }}-race-impact-review
          path: artifacts/gravel-weekly-race-impact-review.md
          retention-days: 90

      - name: Open immutable race-impact review queue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_DATE: ${{ inputs.issue_date }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          if grep -q '<!-- meaningful-race-impact-count: 0 -->' artifacts/gravel-weekly-race-impact-review.md; then
            echo "No actionable race impact; no review issue needed."
            exit 0
          fi
          title="Gravel Weekly #$(printf '%03d' "$ISSUE_NUMBER") race-impact review"
          gh label create gravel-weekly-race-impact --color 0e8a16 --description "Approved Gravel Weekly evidence awaiting controlled race-profile review" --force
          existing="$(gh issue list --label gravel-weekly-race-impact --state all --limit 200 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)"
          if [[ -n "$existing" ]]; then
            echo "Review issue #$existing already exists; preserving its history."
          else
            gh issue create --title "$title" --label gravel-weekly-race-impact --body-file artifacts/gravel-weekly-race-impact-review.md
          fi

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/siteground_key
          chmod 600 ~/.ssh/siteground_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy publication, homepage, redirect, and purge cache
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: python scripts/push_wordpress.py --sync-gravel-weekly --sync-homepage --sync-redirects --purge-cache

      - name: Verify exact issue is live
        env:
          ISSUE_DATE: ${{ inputs.issue_date }}
          ISSUE_HASH: ${{ steps.issue.outputs.hash }}
        run: |
          for url in \
            "https://gravelgodcycling.com/gravel-weekly/" \
            "https://gravelgodcycling.com/gravel-weekly/$ISSUE_DATE/"; do
            found=false
            for attempt in 1 2 3 4 5; do
              if curl -fsSL "$url?v=$ISSUE_HASH" | grep -q "gravel-weekly-content-hash: $ISSUE_HASH"; then
                found=true
                break
              fi
              sleep 10
            done
            if [[ "$found" != true ]]; then
              echo "::error::Expected issue hash is not live at $url"
              exit 1
            fi
          done
          test "$(curl -sIL -o /dev/null -w '%{url_effective}' https://gravelgodcycling.com/gravel-tv/)" = "https://gravelgodcycling.com/gravel-weekly/"

      - name: Send approved issue
        if: ${{ inputs.send_email }}
        env:
          ISSUE_DATE: ${{ inputs.issue_date }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/send_gravel_weekly.py --issue-date "$ISSUE_DATE"
