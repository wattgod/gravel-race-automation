name: "Gravel Weekly Publish"

# Evidence collection and editorial preparation happen in the separate
# race-intelligence control plane every Friday. This workflow is deliberately
# manual: a model draft cannot become Matti's published opinion because a cron
# fired. Commit a schema-valid, status=published issue snapshot, then dispatch
# this workflow with that issue date.

on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: "Approved issue date (YYYY-MM-DD)"
        required: true
        type: string
      send_email:
        description: "Send this issue to the existing Gravel TV/Weekly audience"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: gravel-weekly-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify selected issue is approved for publication
        id: issue
        env:
          ISSUE_DATE: ${{ inputs.issue_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from scripts.validate_gravel_weekly import validate_issue

          issue_date = os.environ["ISSUE_DATE"]
          path = Path("data/gravel-weekly/issues") / f"{issue_date}.json"
          if not path.exists():
              raise SystemExit(f"Approved issue not found: {path}")
          issue = validate_issue(json.loads(path.read_text()))
          if issue["status"] != "published":
              raise SystemExit("Workflow requires status=published; model drafts and prepared issues cannot deploy")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"hash={issue['contentHash']}\n")
              output.write(f"number={issue['issueNumber']}\n")
          PY

      - name: Generate publication and homepage
        run: |
          python wordpress/generate_gravel_weekly.py
          python wordpress/generate_homepage.py

      - name: Verify publication infrastructure
        env:
          ISSUE_DATE: ${{ inputs.issue_date }}
          ISSUE_HASH: ${{ steps.issue.outputs.hash }}
        run: |
          python -m pytest tests/test_gravel_weekly.py -q
          grep -q "G-EJJZ9T6M52" wordpress/output/gravel-weekly.html
          grep -q "gravel-weekly-content-hash: $ISSUE_HASH" wordpress/output/gravel-weekly.html
          grep -q "gravel-weekly-content-hash: $ISSUE_HASH" "wordpress/output/gravel-weekly/$ISSUE_DATE/index.html"
          python scripts/preflight_quality.py

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/siteground_key
          chmod 600 ~/.ssh/siteground_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy publication, homepage, redirect, and purge cache
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: python scripts/push_wordpress.py --sync-gravel-weekly --sync-homepage --sync-redirects --purge-cache

      - name: Verify exact issue is live
        env:
          ISSUE_DATE: ${{ inputs.issue_date }}
          ISSUE_HASH: ${{ steps.issue.outputs.hash }}
        run: |
          for url in \
            "https://gravelgodcycling.com/gravel-weekly/" \
            "https://gravelgodcycling.com/gravel-weekly/$ISSUE_DATE/"; do
            found=false
            for attempt in 1 2 3 4 5; do
              if curl -fsSL "$url?v=$ISSUE_HASH" | grep -q "gravel-weekly-content-hash: $ISSUE_HASH"; then
                found=true
                break
              fi
              sleep 10
            done
            if [[ "$found" != true ]]; then
              echo "::error::Expected issue hash is not live at $url"
              exit 1
            fi
          done
          test "$(curl -sIL -o /dev/null -w '%{url_effective}' https://gravelgodcycling.com/gravel-tv/)" = "https://gravelgodcycling.com/gravel-weekly/"

      - name: Send approved issue
        if: ${{ inputs.send_email }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/send_gravel_weekly.py
