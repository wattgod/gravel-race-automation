name: "Weekly Fact Refresh"

# The race-content freshness loop, facts tier:
#   scrape official sites (stale dates first) → Claude extraction →
#   fact_check --auto-fix (whitelisted fields: dates, status) →
#   verification gates (fabricated-claims audit + date format tests) →
#   review branch + notification issue. Merging the review PR makes corrected
#   dates available to the controlled race-page deploy.
#
# Guardrails:
#   - Whitelisted FACT fields only (dates, cancelled/paused status);
#     editorial content never auto-publishes
#   - Anomaly brake: >10 changed profiles → issue instead of commit
#   - Budget: scraping is free; extraction is about $0.002/race with the cheap
#     model, or ~$0.01-0.05/race on Claude, on the stale subset (≤50/run)

on:
  schedule:
    # Tuesdays 14:00 UTC — fresh factual data before Friday's review cycle
    - cron: '0 14 * * 2'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Ignore cache, re-scrape stale races'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests pyyaml anthropic beautifulsoup4 pytest "scrapling[fetchers]"
          # Browser for sites that block plain requests; plain fetches work without it.
          scrapling install || echo "::warning::browser install failed; blocked sites will be skipped"

      # No "|| true" on this step: a crash must fail the run. The scraper was
      # once missing from the install line and every run silently did nothing.
      # The pages are public, so extraction uses the cheap model
      # (thinkingmachines/inkling-2-mini, about $0.002 a page) when its key is
      # set, and Claude otherwise. Either way a date is kept only when the
      # page itself shows it (date_is_on_page in scrape_utils.py).
      - name: Scrape + extract (stale dates first)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORCE_ALL: ${{ inputs.force_all }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then EXTRACTOR=inkling; else EXTRACTOR=claude; fi
          echo "Extractor: $EXTRACTOR"
          args=(--stale-only --limit 50 --extractor "$EXTRACTOR")
          if [ "$FORCE_ALL" = "true" ]; then args+=(--force); fi
          python scripts/scrape_official_sites.py "${args[@]}"

      - name: Apply safe fixes
        run: python scripts/fact_check_profiles.py --auto-fix || true

      - name: Count changed profiles
        id: changes
        run: |
          CHANGED=$(git status --porcelain --untracked-files=all -- race-data/ | wc -l | tr -d ' ')
          echo "count=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "Changed profiles: $CHANGED"
          git diff --stat race-data/ | tail -5

      - name: Verification gates
        if: steps.changes.outputs.count != '0' && steps.changes.outputs.count <= 10
        run: |
          claims=$(mktemp "$RUNNER_TEMP/fact-claims.XXXXXX")
          trap 'rm -f "$claims"' EXIT
          audit_status=0
          python scripts/audit_fabricated_claims.py --json > "$claims" || audit_status=$?
          if [ "$audit_status" -gt 1 ]; then exit "$audit_status"; fi
          UNSUPPORTED=$(python3 -c 'import json, sys; print(sum(f.get("severity") == "unsupported" for f in json.load(sys.stdin)))' < "$claims")
          if [ "$UNSUPPORTED" != "0" ]; then
            echo "::error::Claims audit found $UNSUPPORTED unsupported claim(s) after refresh — refusing to commit"
            exit 1
          fi
          python -m pytest tests/test_dates.py -q

      - name: Anomaly brake — too many changes
        if: steps.changes.outputs.count > 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGE_COUNT: ${{ steps.changes.outputs.count }}
        run: |
          git diff --stat race-data/ > /tmp/diffstat.txt
          gh issue create \
            --title "Fact refresh anomaly: $CHANGE_COUNT profiles changed in one run" \
            --body "$(printf 'The weekly fact refresh changed more than 10 profiles, which exceeds the anomaly brake. No PR was opened — review the run logs.\n\n```\n%s\n```' "$(cat /tmp/diffstat.txt)")"
          echo "::warning::Anomaly brake tripped — issue opened, no commit"
          git checkout -- race-data/
          exit 0

      - name: Publish fact changes for review
        if: steps.changes.outputs.count != '0' && steps.changes.outputs.count <= 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGE_COUNT: ${{ steps.changes.outputs.count }}
        run: |
          branch="review/fact-refresh/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          review_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          git config user.name "fact-refresh-bot"
          git config user.email "fact-refresh@gravelgodcycling.com"
          git add -- race-data/ data/fact-check-report.json data/scrape-extracts/
          git commit -m "fact-refresh: scraped date/status fixes ($(date +%Y-%m-%d))"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$branch"
          printf 'Review the proposed updates in a [pull request](%s).\n' "$review_url" >> "$GITHUB_STEP_SUMMARY"
          gh issue create \
            --title "Fact refresh ready for review: $CHANGE_COUNT profile fix(es) — $(date +%Y-%m-%d)" \
            --body "$(printf 'The claims audit and date-format tests passed. [Open a pull request for the proposed updates](%s).\n\n```\n%s\n```' "$review_url" "$(git diff --stat HEAD~1 | tail -8)")"

      - name: No changes
        if: steps.changes.outputs.count == '0'
        run: echo "Nothing stale this week."
