name: "XC Weekly Draft Staging"

# Matti's comment on a Sunday brief issue (label xc-weekly-brief) drafts the
# issue: the shortlist plus his reactions go to the drafter, the publication
# gate runs, a preview goes to the review inbox and the staged review is posted
# back on the same issue. Only Matti's comments count. Nothing goes to
# subscribers from this workflow; sending is xc-weekly-send.yml with the
# approved hash.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      brief_issue:
        description: "Number of the xc-weekly-brief issue to draft from"
        required: true

permissions:
  contents: read
  issues: write
  actions: read

defaults:
  run:
    shell: bash  # -eo pipefail: a failed step piped through tee still fails

jobs:
  stage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request == null &&
       contains(github.event.issue.labels.*.name, 'xc-weekly-brief') &&
       github.event.comment.user.login == 'wattgod')
    # Job-level, so a skipped job (someone else's comment) never joins the
    # group and cannot cancel Matti's draft.
    concurrency:
      group: xc-weekly-draft-${{ github.event.issue.number || inputs.brief_issue }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BRIEF_ISSUE: ${{ github.event.issue.number || inputs.brief_issue }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install canonical runtime
        run: pip install -r requirements.txt

      - name: Fetch the brief and Matti's reactions
        run: |
          gh issue view "$BRIEF_ISSUE" --json body,labels > "$RUNNER_TEMP/brief-issue.json"
          BRIEF_RUN="$(python3 - <<'PY'
          import json, os, re, sys
          issue = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "brief-issue.json")))
          if "xc-weekly-brief" not in [label["name"] for label in issue["labels"]]:
              sys.exit("not an xc-weekly-brief issue")
          match = re.search(r"xc-weekly-brief-run: (\d+)", issue["body"])
          if not match:
              sys.exit("brief issue has no run marker")
          print(match.group(1))
          PY
          )"
          gh run download "$BRIEF_RUN" -n "xc-weekly-brief-$BRIEF_RUN" -D "$RUNNER_TEMP/brief"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$BRIEF_ISSUE/comments" \
            --jq '.[] | select(.user.login == "wattgod") | .body | @json' \
            | python3 -c 'import json, sys; print(json.dumps([json.loads(l) for l in sys.stdin if l.strip()]))' \
            > "$RUNNER_TEMP/reactions.json"

      - name: Draft and gate the issue
        id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          number="$(python scripts/send_xc_weekly.py --next-issue-number)"
          set +e
          python scripts/draft_xc_weekly.py --from-brief "$RUNNER_TEMP/brief" \
            --reactions "$RUNNER_TEMP/reactions.json" \
            --issue-number "$number" --output-dir artifacts/xc-weekly-stage
          rc=$?
          set -e
          if [[ $rc -eq 3 ]]; then
            echo "staged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ $rc -eq 0 ]] || exit "$rc"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path("artifacts/xc-weekly-stage/manifest.json").read_text())
          assert m["humanApprovalRequired"] is True and m["autoSendAllowed"] is False
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"staged=true\nnumber={m['issueNumber']}\ndate={m['issueDate']}\nhash={m['contentHash']}\n")
          PY

      - uses: actions/upload-artifact@v4
        if: steps.draft.outputs.staged == 'true'
        with:
          name: xc-weekly-stage-${{ github.run_id }}
          path: artifacts/xc-weekly-stage/
          retention-days: 90

      - name: Email the preview to the review inbox
        if: steps.draft.outputs.staged == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send_xc_weekly.py --preview artifacts/xc-weekly-stage

      - name: Post the staged issue back on the brief
        if: steps.draft.outputs.staged == 'true'
        env:
          NUMBER: ${{ steps.draft.outputs.number }}
          HASH: ${{ steps.draft.outputs.hash }}
        run: |
          {
            echo "Staged XC Ski Labs Weekly No. $(printf '%03d' "$NUMBER") from your reactions. A preview went to the review inbox. Nothing has gone to subscribers."
            echo
            echo "Comment again to redraft. To send this version, run **XC Weekly Send** with stage run \`$GITHUB_RUN_ID\` and approved hash \`$HASH\`."
            echo
            echo "[Stage artifacts (issue.json, preview.html, evidence)]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo "---"
            echo
            cat artifacts/xc-weekly-stage/review.md
          } > "$RUNNER_TEMP/review-body.md"
          gh label create xc-weekly-draft --color 1e2b3c --description "Staged XC Ski Labs Weekly awaiting review" --force
          gh issue comment "$BRIEF_ISSUE" --body-file "$RUNNER_TEMP/review-body.md"
          gh issue edit "$BRIEF_ISSUE" --add-label xc-weekly-draft
