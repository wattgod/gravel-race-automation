name = "course-access"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
ALLOWED_ORIGINS = "https://gravelgodcycling.com"
COACHING_PIPELINE_URL = "https://athlete-custom-training-plan-pipeline-production.up.railway.app"

[[d1_databases]]
binding = "DB"
database_name = "course-platform"
database_id = "e9ce1ef3-46df-4bd8-9f49-c3b4a6bd9a9f"
migrations_dir = "migrations"

[triggers]
crons = ["23 14 * * *"]

# Secrets (set via: wrangler secret put SECRET_NAME)
# STRIPE_WEBHOOK_SECRET    — Stripe webhook signing secret
# SENDGRID_API_KEY         — SendGrid API key (mail send)
# NOTIFICATION_EMAIL       — Where purchase notifications go
# ADMIN_API_KEY            — Admin dashboard + grant endpoint auth
# COURSE_ACCESS_GRANT_KEY  — Pipeline-only case-bound grant endpoint auth
# NUDGE_UNSUBSCRIBE_SECRET — HMAC key for unsubscribe tokens
# COACHING_PROGRESS_SECRET — Case-bound, privacy-minimized progress sync auth
