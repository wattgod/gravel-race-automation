name = "course-nudge"
main = "worker.js"
compatibility_date = "2024-01-01"

# Cron trigger: daily at 14:00 UTC (9 AM ET)
[triggers]
crons = ["0 14 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "course-platform"
database_id = "e9ce1ef3-46df-4bd8-9f49-c3b4a6bd9a9f"

# Secrets (set via: wrangler secret put SECRET_NAME)
# RESEND_API_KEY           — Resend API key (mail send) — replaces SendGrid, whose account is dead (401s)
# NUDGE_UNSUBSCRIBE_SECRET — HMAC key for unsubscribe tokens
# ADMIN_API_KEY            — Optional: for manual trigger via fetch

[vars]
COURSE_ACCESS_WORKER_URL = "https://course-access.gravelgodcoaching.workers.dev"
# noreply@ is the only gravelgodcycling.com sender confirmed to deliver via
# Resend — other addresses on the domain (e.g. courses@, matti@) are accepted
# but can silently never arrive.
FROM_EMAIL = "noreply@gravelgodcycling.com"
FROM_NAME = "Gravel God Courses"
SITE_BASE_URL = "https://gravelgodcycling.com"
