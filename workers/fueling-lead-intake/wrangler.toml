name = "fueling-lead-intake"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
ALLOWED_ORIGINS = "https://gravelgodcycling.com,https://www.gravelgodcycling.com,https://roadielabs.com,https://www.roadielabs.com,https://xcskilabs.com,https://www.xcskilabs.com"

[env.production]
vars = { ALLOWED_ORIGINS = "https://gravelgodcycling.com,https://www.gravelgodcycling.com,https://roadielabs.com,https://www.roadielabs.com,https://xcskilabs.com,https://www.xcskilabs.com" }

# Secrets (set via: wrangler secret put SECRET_NAME)
# RESEND_API_KEY       — Resend API key (fueling calculator lead notifications + athlete review notifications)
# SENDGRID_API_KEY      — legacy fallback for athlete review notifications only; SendGrid account is dead (401s) so this never fires
# NOTIFICATION_EMAIL   — Where fueling calculator lead / athlete review notifications go
# COACHING_WEBHOOK_URL — Optional webhook for fueling calculator leads
# MC_WEBHOOK_URL       — Mission Control base URL (e.g. https://mc.example.com)
# MC_WEBHOOK_SECRET    — Bearer token for Mission Control webhook auth
#
# SendGrid Marketing Contacts upsert (SG_LIST_ID / SG_FIELD_*) was removed —
# Mission Control's database is the lead list of record and nothing read the
# SendGrid list.
